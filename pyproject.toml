[project]
name = "timeseries-forecasting"
version = "0.1.0"
description = "Demand forecasting demo using Google TimesFM on retail data"
requires-python = ">=3.10,<3.14"
dependencies = [
    "timesfm[torch]>=1.3.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "statsmodels>=0.14.0",
    "gradio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["timeseries_forecasting"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
